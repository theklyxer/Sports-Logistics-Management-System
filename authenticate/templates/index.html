{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login / Signup</title>
    <style>
body {
    font-family: Arial;
    background: #f0f0f0;
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
}

.container {
    background: #fff;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 0 10px #aaa;
    width: 300px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

button {
    width: 100%;
    padding: 10px;
    background: #007bff;
    border: none;
    color: white;
    margin-top: 10px;
    cursor: pointer;
}

#message {
    color: red;
    font-size: 0.9em;
    margin-top: 1em;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="loginUsername" placeholder="Username" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <h2>Signup</h2>
        <form id="signupForm">
        <input type="text" id="signupUsername" placeholder="Username" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="text" id="signupPhone" placeholder="Phone" required>
        <input type="number" id="signupAge" placeholder="Age">
        <button type="submit">Signup</button>
    </form>

    <form id="otpForm" style="display: none;">
        <input type="text" id="otpCode" placeholder="Enter OTP" required>
        <button type="submit">Verify OTP</button>
    </form>


        <div id="message"></div>
    </div>

<script>
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");
const msgDiv = document.getElementById("message");

loginForm.onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;

    const res = await fetch("/api/login-cookie/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        credentials: "include",
        body: JSON.stringify({ username, password })
    });
    console.log(res)
    if (res.ok) {
        const infoRes = await fetch("api/current-user/", {
            method: "GET",
            credentials: "include"
        });

        if (infoRes.ok) {
            const data = await infoRes.json();
            const role = data.role;

            if (role === "student") {
                window.location.href = "/dashboard/student/";
            } else if (role === "staff") {
                window.location.href = "/dashboard/staff/";
            } 
            else {
                window.location.href = "/";
            }
        } else {
            msgDiv.textContent = "Could not fetch user role.";
        }
    } else {
        msgDiv.textContent = "Login failed.";
    }
};

let tempSignupData = {};

signupForm.onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById("signupUsername").value;
    const password = document.getElementById("signupPassword").value;
    const phone = document.getElementById("signupPhone").value;
    const age = document.getElementById("signupAge").value;
    const email = document.getElementById("signupEmail").value;

    const res = await fetch("/signup/request-otp/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ username, password, phone, age, email })
    });

    const data = await res.json();
    if (res.ok) {
        tempSignupData = { username, password, phone, age, email };
        msgDiv.textContent = "OTP sent to your email or phone. Enter it below.";
        signupForm.style.display = "none";
        otpForm.style.display = "block";
    } else {
        msgDiv.textContent = data.error || "Signup failed. Try again.";
    }
};

document.getElementById("otpForm").onsubmit = async (e) => {
    e.preventDefault();
    const otp = document.getElementById("otpCode").value;

    const res = await fetch("/signup/verify-otp/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ ...tempSignupData, otp })
    });

    const data = await res.json();
    if (res.ok) {
        msgDiv.textContent = "Signup verified! You can now log in.";
        otpForm.reset();
        otpForm.style.display = "none";
        signupForm.style.display = "block";
        signupForm.reset();
    } else {
        msgDiv.textContent = data.error || "OTP verification failed.";
    }
};

</script>
</body>
</html>
